version: '3.8'

services:
  db:
    image: postgres:18.1-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    networks:
      - accounting_network

  pgAdmin:
    image: elestio/pgadmin:latest
    restart: always
    ports:
      - "8080:8080"
    networks:
      - accounting_network
    environment:
      PGADMIN_DEFAULT_EMAIL: pg@admin.com
      PGADMIN_DEFAULT_PASSWORD: 123456
      PGADMIN_LISTEN_PORT: 8080
    volumes:
        - ./pg-admin-servers.json:/pgadmin4/servers.json
    depends_on:
      - db

    


networks:
  accounting_network:
    driver: bridge


volumes:
  accounting_volume:
    driver: local